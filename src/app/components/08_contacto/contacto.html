<section class="contacto-section">
  <div class="container">
    <div class="titulo">
      <p class="tagline">{{ 'contacto.tagline' | content }} <img src="assets/img/BE-BOXES_logo_blanco.png" alt="Logo Be Boxes Blanco"> </p>
      <h2>{{ 'contacto.title' | content }}</h2>
      <p class="descripcion">
        {{ 'contacto.description' | content }}
      </p>
    </div>

    <button class="btn-primary" (click)="abrirWhatsApp()">
      {{ 'contacto.boton' | content }}
    </button>

  </div>


</section>
    <img src="assets/img/linea-de-meta_negro.png" alt="Cinta decorativa" class="cinta" />
