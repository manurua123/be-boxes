<section class="metodo-section">
  <div class="container">
    <div class="titulo">
      <span class="tagline">{{ 'metodo.tagline' | content }}</span>

      <h2>{{ 'metodo.title' | content }}</h2>
      <p class="descripcion">
        {{ 'metodo.description' | content }}
      </p>
    </div>
    <div class="cuadrados">
      <div class="cuadrado">
        <span class="tagline">01</span>
        <p>{{ 'metodo.step1' | content }}</p>
      </div>
      <div class="cuadrado">
        <span class="tagline">02</span>
        <p>{{ 'metodo.step2' | content }}</p>
      </div>
      <div class="cuadrado">
        <span class="tagline">03</span>
        <p>{{ 'metodo.step3' | content }}</p>
      </div>
      <div class="cuadrado">
        <span class="tagline">04</span>
        <p>{{ 'metodo.step4' | content }}</p>
      </div>
    </div>
  </div>
</section>
